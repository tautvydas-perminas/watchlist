name: Deploy Watchlist Azure Function (OIDC)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'editor.js'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: watchlist-function-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: watchlist-function
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Validate Python source
        run: |
          python -m compileall -q api
          test -f api/host.json
          test -f api/requirements.txt

      - name: Bundle the editor frontend
        run: |
          mkdir -p api/editor_assets
          cp index.html styles.css app.js editor.js api/editor_assets/
          printf '%s\n' 'window.WATCHLIST_EDITOR_API = window.location.origin;' > api/editor_assets/editor-config.js
          node --check api/editor_assets/app.js
          node --check api/editor_assets/editor.js

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Python Function App
        uses: Azure/functions-action@v1
        with:
          app-name: fa-watchlistmanager
          package: ./api
          respect-pom-xml: false
