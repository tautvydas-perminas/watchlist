name: Deploy website to Azure Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-storage-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare website files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool watches.json > /dev/null
          python3 -m json.tool watches-limited.json > /dev/null
          python3 scripts/validate_collections.py
          node --check app.js
          node --check editor.js
          node --check editor-config.js
          mkdir -p "${RUNNER_TEMP}/watchlist-site"
          cp index.html app.js editor.js editor-config.js styles.css watches.json watches-limited.json "${RUNNER_TEMP}/watchlist-site/"

      - name: Upload website to Azure Storage
        shell: bash
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          if [[ -z "${AZURE_STORAGE_CONNECTION_STRING}" ]]; then
            echo "::error::Add the AZURE_STORAGE_CONNECTION_STRING repository secret before deploying."
            exit 1
          fi
          echo "Source watches.json SHA256: $(sha256sum "${RUNNER_TEMP}/watchlist-site/watches.json" | cut -d' ' -f1)"
          az storage blob upload-batch \
            --destination '$web' \
            --source "${RUNNER_TEMP}/watchlist-site" \
            --overwrite true \
            --connection-string "${AZURE_STORAGE_CONNECTION_STRING}" \
            --content-cache-control "no-cache" \
            --only-show-errors

          az storage blob download \
            --container-name '$web' \
            --name watches.json \
            --file "${RUNNER_TEMP}/watches-verified.json" \
            --connection-string "${AZURE_STORAGE_CONNECTION_STRING}" \
            --overwrite \
            --only-show-errors
          if ! cmp -s "${RUNNER_TEMP}/watchlist-site/watches.json" "${RUNNER_TEMP}/watches-verified.json"; then
            echo "::error::Uploaded watches.json does not match the GitHub source."
            exit 1
          fi
          echo "Verified Azure Storage watches.json matches GitHub source."
